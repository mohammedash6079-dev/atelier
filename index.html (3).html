@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shift{0%,100%{background-position:0 0,0% 50%}50%{background-position:0 0,100% 50%}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes mq{to{transform:translateX(-100%)}}
@keyframes shn{to{transform:translateX(100%)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.grid>.card{animation:up .55s both}.grid>.card:nth-child(2){animation-delay:.07s}.grid>.card:nth-child(3){animation-delay:.14s}.grid>.card:nth-child(4){animation-delay:.21s}.grid>.card:nth-child(5){animation-delay:.28s}.grid>.card:nth-child(6){animation-delay:.35s}
.hx img{animation:flt 4s ease-in-out infinite}.hx .pill{display:inline-flex;align-items:center;gap:6px}.hx .pill svg,.btn svg{width:15px;height:15px;flex:none}
.btn{transition:transform .15s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.96)}
.ico{transition:transform .2s}.ico:hover{transform:translateY(-3px) scale(1.14)}
.bdg{position:absolute;top:10px;left:10px;background:#e11d48;color:#fff;font:700 12px var(--disp);padding:5px 11px;border-radius:99px;animation:pls 1.6s infinite}
.old{text-decoration:line-through;color:var(--mut);font:400 13px "Inter",sans-serif;margin-left:6px;-webkit-text-fill-color:var(--mut)}
.mq{overflow:hidden;white-space:nowrap;border-radius:12px;background:var(--grad);color:#fff;padding:9px 0;margin-bottom:14px;font-weight:600}.mq span{display:inline-block;padding-left:100%;animation:mq 24s linear infinite}
.offs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-bottom:14px}
.off{min-width:250px;flex:1;scroll-snap-align:start;border-radius:var(--r);padding:16px;color:#fff;position:relative;overflow:hidden;cursor:pointer;background:var(--oc);animation:up .55s both;transition:transform .2s}.off:hover{transform:translateY(-4px)}
.off::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:shn 3.5s infinite}
.off svg{width:30px;height:30px;animation:wig 2.4s infinite}.off b{display:block;font-size:17px;margin:6px 0 2px}.off .cd{display:inline-block;border:1px dashed rgba(255,255,255,.75);padding:2px 10px;border-radius:8px;font-weight:700;letter-spacing:.1em;margin-top:8px}
.swt{width:36px;height:30px;padding:0}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== ATELIER: navy velvet + rose gold ===== */
:root{--r:14px;--sh:0 14px 40px rgba(0,0,0,.28);--btnT:#1a0f0a}
html{background:var(--bg)}
body{font-family:"Jost","Segoe UI",system-ui,sans-serif;font-weight:400;letter-spacing:.01em;
 background:radial-gradient(900px 520px at 88% -120px,rgba(var(--rg2b),.13),transparent),radial-gradient(700px 600px at -10% 35%,rgba(var(--glow),.30),transparent),linear-gradient(180deg,var(--bga),var(--bgb) 60%,var(--bga));background-attachment:fixed}
h1,h2,h3{font-family:var(--disp)}
h2{font-size:22px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--rgl);display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--rgb),.5),transparent)}
h3{font-weight:600;font-size:19px;letter-spacing:.04em}
/* header */
header{background:rgba(var(--hd),.86);border-bottom:1px solid rgba(var(--rgb),.28);padding:12px 22px}
.brand{display:flex;flex-direction:row;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:contain;}
.brand>span{display:flex;flex-direction:column;line-height:1}
.brand b{font:600 22px "Cinzel",serif;letter-spacing:.42em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font:400 9px "Jost",sans-serif;letter-spacing:.62em;text-transform:uppercase;color:var(--mut);margin-top:6px;padding-left:3px}
nav button{font-family:"Jost",sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;padding:8px 14px;color:var(--ink)}
nav button:hover{background:rgba(var(--rgb),.12);color:var(--rgl)}
nav button.on,#tabbar button.on,.chip.on{background:var(--grad);color:var(--btnT);border-color:transparent}
/* buttons */
.btn{background:var(--grad);color:var(--btnT);border-radius:2px;font-weight:600;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;padding:11px 20px;box-shadow:0 6px 18px rgba(var(--rg2b),.22)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--rgl);border:1px solid rgba(var(--rgb),.5);box-shadow:none}
.btn.alt:hover{background:rgba(var(--rgb),.1)}
.btn.sm{padding:6px 12px;font-size:11px}
/* cards */
.card{background:linear-gradient(180deg,rgba(var(--c1),.85),rgba(var(--c2),.92));border:1px solid rgba(var(--rgb),.18);border-radius:var(--r);box-shadow:var(--sh)}
.stat{background:linear-gradient(180deg,rgba(var(--c1),.85),rgba(var(--c2),.92));border:1px solid rgba(var(--rgb),.18);border-radius:var(--r);box-shadow:var(--sh)}
.stat b{font:600 28px var(--disp);color:var(--rgl)}
input,select{background:rgba(var(--sf),.8);border:1px solid var(--line);border-radius:2px;padding:10px 12px;color:var(--ink)}
input:focus,select:focus{border-color:var(--rg);outline:none;box-shadow:0 0 0 3px rgba(var(--rgb),.15)}
select option{background:var(--card);color:var(--ink)}
th{font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rg)}
td,th{border-bottom:1px solid var(--line)}
.tag{border-radius:2px;letter-spacing:.06em}
.lbl{color:var(--rg);letter-spacing:.2em;font-weight:500}
/* hero */
.hx{border-radius:var(--r);padding:44px 36px;gap:34px;border:1px solid rgba(var(--hab),.35);color:var(--on);
 background:radial-gradient(600px 300px at 100% 0,rgba(var(--hab),.22),transparent),radial-gradient(500px 300px at 0 100%,rgba(var(--hg),.35),transparent),linear-gradient(125deg,var(--h1),var(--h2) 55%,var(--h3));background-size:auto;animation:none;box-shadow:var(--sh),inset 0 0 0 6px rgba(var(--h1b),.6),inset 0 0 0 7px rgba(var(--hab),.18);position:relative}
.hx::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(var(--hab),.07) 48%,transparent 60%)}

.hx h1{font:600 clamp(28px,4.6vw,46px)/1.1 var(--disp);letter-spacing:.04em;margin:0 0 12px;background:linear-gradient(135deg,var(--ha),var(--ha2) 55%,var(--ha));-webkit-background-clip:text;background-clip:text;color:transparent}
.hx p{font-weight:300;font-size:16px;opacity:.9;max-width:480px;margin:0 0 18px;color:var(--on)}
.hx .pill{background:rgba(var(--hab),.08);border:1px solid rgba(var(--hab),.4);border-radius:2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;color:var(--ha)}
.hx .pill svg{color:var(--ha)}
/* marquee + offers */
.mq{border-radius:2px;background:transparent;border-top:1px solid rgba(var(--rgb),.4);border-bottom:1px solid rgba(var(--rgb),.4);color:var(--rgl);font:500 12px "Jost",sans-serif;letter-spacing:.3em;text-transform:uppercase;padding:11px 0}
.off{border-radius:var(--r);border:1px solid rgba(var(--rgb),.3)}
.off::after{background:linear-gradient(110deg,transparent 30%,rgba(var(--hab),.18) 50%,transparent 70%)}

/* products */
.grid{gap:22px}

.pc:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(var(--rgb),.45)}

.pc .bd h3{font:600 21px var(--disp);letter-spacing:.03em;margin:0}

/* Order id = customer phone number + order count */
function newId(ph){const d=String(ph||"").replace(/\D/g,"");if(!d)return"AT-"+(1000+S.nid++);S.nid++;let n=S.orders.filter(o=>o.id.split("-")[0]==d).length+1,id=d+"-"+n;while(S.orders.some(o=>o.id==id))id=d+"-"+(++n);return id}
/* ===== Added: Sales report, customer contacts, publish ===== */
if(!ADM.some(a=>a[0]=="pub"))ADM.push(["pub","Publish"]);
const R={from:"",to:"",pay:"All"};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function repRows(){return S.orders.filter(o=>{if(R.pay!="All"&&o.payStatus!=R.pay)return false;if(!R.from&&!R.to)return true;if(!o.ts)return false;const k=dkey(o.ts);return(!R.from||k>=R.from)&&(!R.to||k<=R.to)})}
function repData(){const all=repRows(),L=all.filter(live),sum=(a,f)=>a.reduce((x,o)=>x+f(o),0);
 const byDay={},byProd={},byPay={};
 L.forEach(o=>{const k=o.ts?dkey(o.ts):"No date";(byDay[k]=byDay[k]||{n:0,t:0}).n++;byDay[k].t+=o.total;
  const m=o.method||"Other";(byPay[m]=byPay[m]||{n:0,t:0}).n++;byPay[m].t+=o.total;
  o.items.forEach(i=>{const p=byProd[i.name]=byProd[i.name]||{q:0,t:0};p.q+=i.n;p.t+=(i.price||0)*i.n})});
 return{all,L,rev:sum(L,o=>o.total),disc:sum(L,o=>o.disc||0),ship:sum(L,o=>o.ship||0),units:sum(L,o=>o.items.reduce((a,i)=>a+i.n,0)),paid:sum(L.filter(o=>o.payStatus=="Paid"),o=>o.total),pend:sum(L.filter(o=>o.payStatus=="Pending"),o=>o.total),lost:all.length-L.length,byDay,byProd,byPay}}
function setRange(k){const d=new Date(),f=x=>dkey(x);R.to=f(d);
 if(k=="today")R.from=R.to;else if(k=="7"){const x=new Date();x.setDate(x.getDate()-6);R.from=f(x)}else if(k=="30"){const x=new Date();x.setDate(x.getDate()-29);R.from=f(x)}else if(k=="month"){R.from=f(new Date(d.getFullYear(),d.getMonth(),1))}else{R.from="";R.to=""}render()}
function dl(name,text,type){const b=new Blob([text],{type:type||"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const csvc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function repCsv(){const D=repData();let c="Order,Date,Customer,Phone,Items,Subtotal,Discount,Shipping,Total,Payment method,Payment status,Order status\n";
 D.all.forEach(o=>{c+=[o.id,o.date,o.cust,phoneOf(o),o.items.map(i=>i.name+" "+VL(i.s,i.c)+" x"+i.n).join("; "),o.sub??"",o.disc||0,o.ship??"",o.total,o.method,o.payStatus,o.status].map(csvc).join(",")+"\n"});
 dl("sales-report-"+dkey(Date.now())+".csv","\ufeff"+c);toast("Sales report downloaded")}
function repPdf(){if(!window.jspdf)return toast("The PDF tool is still loading. Try again in a moment.");
 const D=repData(),{jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),sh=S.shop||{name:"ATELIER"},mon=n=>"Rs. "+Number(n).toLocaleString("en-US");let y=18;
 const chk=()=>{if(y>275){d.addPage();y=18}};
 d.setFontSize(18);d.setTextColor(20);d.text(sh.name+" - Sales report",15,y);y+=7;d.setFontSize(10);d.setTextColor(90);d.text((R.from||R.to?(R.from||"start")+" to "+(R.to||"today"):"All time")+"   |   Payment: "+R.pay+"   |   Created "+new Date().toLocaleString(),15,y);y+=9;
 [["Revenue",mon(D.rev)],["Orders",String(D.L.length)],["Items sold",String(D.units)],["Average order",mon(D.L.length?Math.round(D.rev/D.L.length):0)],["Paid",mon(D.paid)],["Pending",mon(D.pend)],["Discounts given",mon(D.disc)],["Cancelled/returned",String(D.lost)]].forEach(([a,b])=>{d.setTextColor(90);d.text(a,15,y);d.setTextColor(20);d.text(b,90,y);y+=6});
 const tbl=(title,head,rows)=>{y+=6;chk();d.setFontSize(12);d.setTextColor(20);d.setFont("helvetica","bold");d.text(title,15,y);y+=6;d.setFontSize(10);d.text(head[0],15,y);d.text(head[1],130,y,{align:"right"});d.text(head[2],195,y,{align:"right"});d.setFont("helvetica","normal");y+=2;d.line(15,y,195,y);y+=5;rows.forEach(r=>{chk();d.text(String(r[0]).slice(0,60),15,y);d.text(String(r[1]),130,y,{align:"right"});d.text(String(r[2]),195,y,{align:"right"});y+=5.5})};
 tbl("Sales by day",["Day","Orders","Amount"],Object.entries(D.byDay).sort().reverse().map(([k,v])=>[k,v.n,mon(v.t)]));
 tbl("Sales by product",["Product","Units","Amount"],Object.entries(D.byProd).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>[k,v.q,mon(v.t)]));
 tbl("Sales by payment method",["Method","Orders","Amount"],Object.entries(D.byPay).map(([k,v])=>[k,v.n,mon(v.t)]));
 d.save("sales-report-"+dkey(Date.now())+".pdf")}

 return"AT-"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+r.map(x=>A[x%32]).join("");

const syncSt={},watching={};
function orderDoc(o){return{id:o.id,cust:o.cust,phone:o.phone||"",email:o.email||"",addr:o.addr||"",items:o.items,sub:o.sub||0,disc:o.disc||0,code:o.code||"",ship:o.ship||0,total:o.total,method:o.method||"",ts:o.ts,dt:o.dt||new Date(o.ts).toLocaleString(),date:o.date||"",status:o.status,payStatus:o.payStatus,track:o.track||"",hist:o.hist||[{status:o.status,at:o.ts}],updatedAt:o.ts}}
function cloudPlace(o){
 addMyId(o.id);
 if(!CLOUD){syncSt[o.id]="local";return}
 syncSt[o.id]="saving";watchOrder(o.id);
 DBc.collection("orders").doc(o.id).set(orderDoc(o))
  .then(()=>{syncSt[o.id]="saved";softRender()})
  .catch(e=>{syncSt[o.id]="error";console.warn(e);toast("Order not saved yet: "+(e.code||e.message));softRender()});
}
function retryOrder(id){const o=ord(id);if(o)cloudPlace(o)}
function cloudAdminCreate(o){if(!CLOUD)return;DBc.collection("orders").doc(o.id).set(orderDoc(o)).catch(e=>toast("Could not save sale online: "+(e.code||e.message)))}
function watchOrder(id){
 if(!CLOUD||watching[id])return;
 watching[id]=DBc.collection("orders").doc(id).onSnapshot(s=>{
  if(!s.exists)return;const d=s.data(),p=ord(id);
  if(p&&(p.status!==d.status||p.track!==d.track)&&mode!=="admin")toast("Order "+id+": "+statusMsg(d));
  upsertOrder(d);save();softRender();
 },e=>console.warn("watch "+id,e.code));
}
myIds().forEach(watchOrder);

 const phones=new Set(Object.values(m).map(c=>c.phone).filter(Boolean));
 S.customers=Object.values(m).concat((S.customers||[]).filter(c=>!String(c.id).startsWith("c")&&!phones.has(c.phone)));
}

  const first=!admSeen;
  S.orders=snap.docs.map(d=>d.data());rebuildCust();
  if(!first)snap.docChanges().forEach(ch=>{if(ch.type==="added"&&!ch.doc.metadata.hasPendingWrites){const o=ch.doc.data();beep();toast("🔔 New order "+o.id+" · "+o.cust);notify("New order "+o.id+" from "+o.cust)}});
  admSeen=true;save();softRender();
 },e=>toast("Live orders error: "+(e.code||e.message)));
}

/* ---------- admin actions (write to the shared database) ---------- */
function patchOrder(id,patch,hist){
 const o=ord(id);if(!o)return Promise.resolve();
 const now=Date.now();Object.assign(o,patch,{updatedAt:now});let h=null;
 if(hist){h={status:hist,at:now};o.hist=(o.hist||[]).concat([h])}
 save();softRender();
 if(!CLOUD)return Promise.resolve();
 const u=Object.assign({},patch,{updatedAt:now});if(h)u.hist=firebase.firestore.FieldValue.arrayUnion(h);
 return DBc.collection("orders").doc(id).update(u).catch(e=>toast("Could not save change: "+(e.code||e.message)));
}
setStatus=function(id,s){
 const o=ord(id);if(!o||o.status===s)return;const was=o.status;
 if((s=="Cancelled"||s=="Returned")&&was!="Cancelled"&&was!="Returned")o.items.forEach(i=>{const v=S.products.flatMap(p=>p.name==i.name?p.v:[]).find(x=>x.s==i.s&&x.c==i.c);if(v)v.q+=i.n});
 const p={status:s};if(s=="Returned")p.payStatus="Refunded";
 notify("Order "+id+" is now "+s+" (customer: "+o.cust+")");toast("Status updated: "+s);
 return patchOrder(id,p,s);
};
setPay=function(id,s){notify("Payment for "+id+": "+s);return patchOrder(id,{payStatus:s})};
setTrack=function(id,t){notify("Tracking added to "+id);return patchOrder(id,{track:t})};
function updateTracking(id){
 const el=document.getElementById("trk_"+id),v=((el&&el.value)||"").trim();
 if(!v)return toast("Enter the tracking code");
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 notify("Tracking code for "+id+": "+v);toast("Tracking saved and sent to the customer");
 return patchOrder(id,{track:v});
}
let OF="all";
function setOF(v){OF=v;render()}
function orderCard(o){
 const id=o.id,dt=o.dt||new Date(o.ts).toLocaleString(),cls=o.status==="Cancelled"?"bad":o.status==="Delivered"?"ok":"acc";
 const trk=o.status==="Dispatched"?`<div class="row" style="margin-top:6px"><input id="trk_${id}" placeholder="Courier tracking code" value="${esc(o.track||"")}" style="flex:1;min-width:150px" onkeydown="if(event.key=='Enter')updateTracking('${id}')"><button class="btn sm" onclick="updateTracking('${id}')">Update Tracking</button></div>`:(o.track&&o.status!=="Cancelled"?`<div class="mut" style="margin-top:6px">Tracking code: <b>${esc(o.track)}</b></div>`:"");
 return`<div class="card oc ${o.status==="Order Received"?"fresh":""}">
 <div class="row" style="justify-content:space-between;margin:0"><b>${esc(id)}</b><span class="tag ${cls}">${esc(o.status)}</span></div>
 <div class="mut">${esc(dt)}</div>
 <div style="margin:8px 0"><b>${esc(o.cust)}</b> · ${esc(o.phone||"")}<br><span class="mut">${esc(o.addr||"")}</span></div>
 <div class="scroll"><table class="otbl"><tr><th>Product</th><th>Size</th><th>Colour</th><th>Qty</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.s||"-")}</td><td>${esc(i.c||"-")}</td><td>${i.n}</td></tr>`).join("")}</table></div>
 <div class="mut" style="margin-top:6px">Items ${rs(o.sub??0)} · Delivery fee ${rs(o.ship||0)}${o.disc?` · Discount −${rs(o.disc)}`:""}</div>
 <div><b>Total ${rs(o.total)}</b></div>
 <div class="row" style="margin-top:6px"><span class="mut">Payment: ${esc(o.method||"-")}</span><select onchange="setPay('${id}',this.value)">${["Pending","Paid","Refunded"].map(s=>`<option ${s==o.payStatus?"selected":""}>${s}</option>`).join("")}</select></div>
 <div class="row">${o.status==="Order Received"?`<button class="btn" onclick="setStatus('${id}','Approved')">APPROVE ORDER</button>`:""}<select onchange="setStatus('${id}',this.value)">${STAT.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn sm alt" onclick="billPdf('${id}','send')">Bill PDF</button></div>
 ${trk}</div>`;
}
V.ord=function(){
 const list=S.orders.filter(o=>OF==="all"||o.status===OF),cnt=s=>S.orders.filter(o=>o.status===s).length;
 return`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3 style="margin:0">Order Management ${CLOUD?'<span class="tag ok">● Live</span>':'<span class="tag bad">Local only (Firebase not connected)</span>'}</h3><select onchange="setOF(this.value)"><option value="all">All orders (${S.orders.length})</option>${STAT.map(s=>`<option value="${s}" ${OF===s?"selected":""}>${s} (${cnt(s)})</option>`).join("")}</select></div></div>`
 +(list.length?`<div class="omg">${list.map(orderCard).join("")}</div>`:'<div class="card"><p class="mut">No orders yet. New orders appear here instantly.</p></div>');
};

/* ---------- customer "Track order" page with live timeline ---------- */
let lookMsg="";
function openTrack(code){try{window.open(TRACK_URL+encodeURIComponent(code),"_blank","noopener")}catch(e){}}
function copyId(id){try{navigator.clipboard.writeText(id)}catch(e){}toast("Order ID "+id+" copied")}
function trackLookup(){
 const v=((document.getElementById("tid")||{}).value||"").trim().toUpperCase();lastOrder=v;lookMsg="";
 if(!v){render();return}
 if(ord(v)||!CLOUD){if(CLOUD){addMyId(v);watchOrder(v)}render();return}
 lookMsg="Searching…";render();
 DBc.collection("orders").doc(v).get().then(s=>{
  if(s.exists){upsertOrder(s.data());addMyId(v);watchOrder(v);lookMsg=""}else lookMsg="No order found with that Order ID.";render();
 }).catch(e=>{lookMsg="Could not search: "+(e.code||e.message);render()});
}
function myList(){
 const ids=myIds();if(lastOrder&&!ids.includes(lastOrder))ids.unshift(lastOrder);
 const seen=new Set(),out=[];ids.forEach(id=>{const o=ord(id);if(o&&!seen.has(id)){seen.add(id);out.push(o)}});
 if(!CLOUD&&lastOrder){const pd=lastOrder.replace(/\D/g,"");if(pd.length>=7)S.orders.filter(x=>String(x.phone||"").replace(/\D/g,"")==pd).forEach(o=>{if(!seen.has(o.id)){seen.add(o.id);out.push(o)}})}
 return out;
}
function timelineHtml(o){
 if(o.status==="Cancelled"||o.status==="Returned")return"";
 const cur=Math.max(0,FLOW.indexOf(o.status)),when={};(o.hist||[]).forEach(h=>{if(!when[h.status])when[h.status]=new Date(h.at).toLocaleString()});
 return`<ol class="tl">${FLOW.map((s,i)=>{const done=i<cur||(i===cur&&s==="Delivered");return`<li class="${done?"done":i===cur?"cur":""}"><span class="dot">${done?"✓":i+1}</span><div><b>${s}</b>${when[s]&&i<=cur?`<small>${esc(when[s])}</small>`:""}</div></li>`}).join("")}</ol>`;
}
function custOrder(o){
 const st=syncSt[o.id],dt=o.dt||new Date(o.ts).toLocaleString(),bad=o.status==="Cancelled"||o.status==="Returned",good=o.status==="Approved"||o.status==="Delivered";
 const placed=st==="saving"?`<div class="stbanner">Saving your order…</div>`:st==="saved"?`<div class="stbanner ok">✓ Order placed and saved. Your Order ID is <b>${esc(o.id)}</b></div>`:st==="error"?`<div class="stbanner bad">Your order is not saved yet. <button class="btn sm" onclick="retryOrder('${o.id}')">Try again</button></div>`:st==="local"?`<div class="stbanner ok">✓ Order placed. Your Order ID is <b>${esc(o.id)}</b></div>`:"";
 const tp=o.status==="Dispatched"||o.track?(o.track?`<div class="trk">🚚 Tracking Code: <b>${esc(o.track)}</b> <button class="btn sm" onclick="openTrack('${esc(o.track)}')">Track Order</button></div>`:`<div class="trk mut">Your tracking code will appear here soon.</div>`):"";
 return`<div class="card co">${placed}
 <div class="row" style="justify-content:space-between"><div><span class="mut">Order ID</span><br><b class="oid">${esc(o.id)}</b> <button class="btn sm alt" onclick="copyId('${o.id}')">Copy</button></div><div class="mut">${esc(dt)}</div></div>
 <div class="stbanner ${bad?"bad":good?"ok":""}">${esc(statusMsg(o))}</div>${tp}${timelineHtml(o)}
 <p class="mut" style="margin:10px 0 0">${o.items.map(i=>esc(i.name)+" ("+esc(VL(i.s,i.c))+") ×"+i.n).join("<br>")}<br>Delivery ${rs(o.ship||0)} · <b>Total ${rs(o.total)}</b> · Payment: ${esc(o.method||"-")} (${esc(o.payStatus||"Pending")})</p>
 <div class="row" style="margin-top:8px"><button class="btn sm" onclick="showBill('${o.id}')">View bill</button><button class="btn sm" onclick="toShop('${o.id}')">Send my order to the shop on WhatsApp</button><button class="btn sm" onclick="billPdf('${o.id}','send')">Send bill PDF (choose WhatsApp)</button></div></div>`;
}
V.track=function(){
 const L=myList();
 return`<div class="card"><h2>Track your order</h2><div class="row"><input id="tid" placeholder="Order ID, e.g. AT-260926-K7P3Q" value="${esc(lastOrder)}" style="flex:1;min-width:220px" onkeydown="if(event.key=='Enter')trackLookup()"><button class="btn" onclick="trackLookup()">Track Order</button></div>${lookMsg?`<p class="mut">${esc(lookMsg)}</p>`:""}</div>`
 +(L.length?L.map(custOrder).join(""):`<div class="card"><p class="mut">${lastOrder?"No order found. Check the Order ID and try again.":"Your orders will appear here after you place them."}</p></div>`);
};

/* ===== After order: build the PDF bill and send it to the shop WhatsApp ===== */
function autoSendBill(id){
 const o=ord(id);
 if(!window.jspdf){toShop(id);return}
 let blob;try{blob=makePdf(o).output("blob")}catch(e){toShop(id);return}
 const fn=o.id+"-bill.pdf",f=new File([blob],fn,{type:"application/pdf"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  navigator.share({files:[f],title:"Order "+o.id,text:"New order "+o.id+" - bill PDF (send to +94 75 338 1328)"}).catch(e=>{if(!e||e.name!=="AbortError")toShop(id)});
 }else{
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
  toShop(id);
  toast("Bill PDF downloaded. Attach it in the WhatsApp chat that opened.");
 }
}
